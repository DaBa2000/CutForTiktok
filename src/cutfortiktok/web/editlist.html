<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edit</title>
<link rel="stylesheet" href="/static/common.css">
<style>
main{max-width:1200px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.thumb{position:relative;aspect-ratio:16/9;background:#000;display:block}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.play{cursor:pointer}.thumb.play::after{content:"▶";position:absolute;inset:0;display:grid;place-items:center;font-size:30px;color:#fff;text-shadow:0 2px 10px #000}
dialog{background:#000;border:0;border-radius:14px;padding:0;max-width:min(860px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.75)}
dialog video{display:block;width:100%;max-height:85vh}
.pill{position:absolute;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:rgba(0,0,0,.75)}
.st{left:8px;top:8px}.dur{right:8px;bottom:8px}.parts{right:8px;top:8px;background:#6e40c9}
.st.ready{background:#6e40c9}.st.edited{background:#9e6a03}.st.busy{background:#1f6feb}.st.exp{background:var(--ok)}.st.err{background:#da3633}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:7px;flex:1}
.orig{color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tin{display:flex;gap:6px;align-items:center}
.tin input{flex:1;min-width:0;font:inherit;font-weight:650;background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:7px 9px}
.tin input:focus{outline:none;border-color:var(--acc2)}
.saved{color:var(--ok);font-size:12px;width:16px}
.err{color:#f85149;font-size:12px}
.act{display:flex;gap:6px;margin-top:auto}
.act a,.act button{flex:1;text-align:center;text-decoration:none;padding:8px;border-radius:9px;font:inherit;font-weight:700;cursor:pointer;border:0}
.edit{background:var(--acc);color:#fff}.edit.off{background:var(--panel2);color:var(--mute);pointer-events:none}
.sec{background:var(--panel2);color:var(--fg);border:1px solid var(--line)!important}
.empty{color:var(--mute);text-align:center;padding:60px 0}
.empty a{color:var(--acc2)}
/* "Clips verbinden": pick clips, they are rendered one after another as one video */
.tools{display:flex;justify-content:flex-end;margin-bottom:12px}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:9px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn:disabled{opacity:.5;cursor:default}
.picking .card{cursor:pointer}.picking .card.off{opacity:.4;cursor:not-allowed}
.picking .card a,.picking .card button,.picking .card input{pointer-events:none}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.num{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:800;box-shadow:0 2px 12px #000}
#joinBar{position:sticky;bottom:12px;margin-top:16px;background:var(--panel);border:1px solid var(--acc);border-radius:14px;padding:12px 14px;box-shadow:0 6px 30px rgba(0,0,0,.6)}
#joinBar .it{display:flex;align-items:center;gap:8px;padding:3px 0}
#joinBar .it span.t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#joinBar .it b{width:22px;text-align:center}
#joinBar .x{background:none;border:0;color:var(--mute);font-size:15px;cursor:pointer;padding:2px 6px}
#joinBar .x:hover{color:var(--fg)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style>

<div class="top"><div class="nav"></div></div>
<main><div class="tools"><button class="btn" id="joinStart">🔗 Clips verbinden</button></div>
  <div class="grid" id="grid"></div><div id="joinBar" hidden></div></main>
<dialog id="dlg"><video id="vid" controls playsinline></video></dialog>

<script src="/static/common.js"></script>
<script>
let clips = [], rendering = new Set(), current = null;
let picking = false, picked = [];  // "Clips verbinden": selected ids in play order

async function load() {
  const j = await (await fetch('/api/editlist')).json();
  clips = j.clips; rendering = new Set(j.rendering || []); current = j.prefetch?.current;
  try { localStorage.setItem('clipOrder', JSON.stringify(clips.map(c => c.id))); } catch {}  // editor "next clip"
  if (document.activeElement?.matches('.tin input')) return drawStatus();  // don't disturb typing
  draw();
}

function state(c) {
  if (rendering.has(c.id)) return ['exp', 'exportiert gerade…'];
  if (c.error && !c.ready) return ['err', 'Fehler'];
  if (!c.ready && c.downloaded) return ['busy', c.id === current ? 'Untertitel werden erstellt…' : 'geladen · Untertitel folgen'];
  if (!c.ready) return ['busy', c.id === current ? 'wird heruntergeladen…' : 'in Warteschlange'];
  return c.status === 'pending_review' ? ['edited', 'bearbeitet'] : ['ready', 'bereit ⚡'];
}

function draw() {
  const ready = clips.filter(c => c.ready).length;
  $('info').textContent = `${clips.length} Clips · ${ready} bereit` + (clips.length - ready ? ` · ${clips.length - ready} werden vorbereitet` : '');
  $('grid').innerHTML = clips.map(c => {
    const [cls, label] = state(c);
    const off = picking && (!c.ready || rendering.has(c.id));
    return `<div class="card ${picked.includes(c.id) ? 'sel' : ''} ${off ? 'off' : ''}" data-id="${c.id}">
      <a class="thumb ${!c.ready && c.downloaded ? 'play' : ''}" ${c.ready ? `href="/edit/${c.id}"` : c.downloaded ? `data-play="${c.id}" title="Ansehen – Bearbeiten geht, sobald die Untertitel fertig sind"` : ''}>${c.thumbnail ? `<img loading="lazy" src="${esc(c.thumbnail)}">` : ''}
        <span class="pill st ${cls}">${label}</span>
        ${c.parts > 1 ? `<span class="pill parts">${c.parts} Teile</span>` : ''}
        ${c.chained > 1 ? `<span class="pill parts" style="top:34px">🔗 ${c.chained} Clips verbunden</span>` : ''}
        ${picked.includes(c.id) ? `<span class="num">${picked.indexOf(c.id) + 1}</span>` : ''}
        <span class="pill dur">${Math.round(c.duration || 0)}s</span></a>
      <div class="body">
        <div class="orig" title="${esc(c.title)}">@${esc(c.streamer)} · ${c.views} Views · Original: ${esc(c.title)}</div>
        <div class="tin"><input value="${esc(c.overlay_title ?? c.title)}" placeholder="Titel für das Video" data-t="${c.id}"><span class="saved"></span></div>
        ${c.error ? `<div class="err">${esc(c.error)}</div>` : ''}
        <div class="act"><a class="edit ${c.ready ? '' : 'off'}" href="/edit/${c.id}">Bearbeiten</a>
          <button class="sec" data-back="${c.id}" title="Zurück in den For-You-Feed">↶ Feed</button>
          <button class="sec" data-ign="${c.id}">Ignorieren</button></div>
      </div></div>`;
  }).join('') || '<div class="empty">Noch nichts zum Bearbeiten.<br>Im <a href="/foryou">For You</a>-Feed Clips behalten.</div>';
  picked = picked.filter(id => clips.some(c => c.id === id));
  drawJoin();
}

// ---------- Clips verbinden ----------
function drawJoin() {
  document.body.classList.toggle('picking', picking);
  $('joinStart').textContent = picking ? 'Abbrechen' : '🔗 Clips verbinden';
  $('joinBar').hidden = !picking;
  if (!picking) return;
  const byId = Object.fromEntries(clips.map(c => [c.id, c]));
  $('joinBar').innerHTML = `<b>Clips verbinden</b> <span style="color:var(--mute);font-size:12px">– Clips anklicken (fertig vorbereitete).
      Reihenfolge wie im Stream, mit ↑/↓ änderbar. Danach öffnet sich der Editor mit allen Clips hintereinander als ein Clip (Titel nur am Anfang).</span>
    ${picked.map((id, i) => `<div class="it"><b>${i + 1}</b><span class="t">@${esc(byId[id]?.streamer)} · ${esc(byId[id]?.overlay_title ?? byId[id]?.title)}</span>
      <span style="color:var(--mute);font-size:12px">${Math.round(byId[id]?.duration || 0)}s</span>
      ${i > 0 ? `<button class="x" data-jmv="${i}" data-dir="-1">↑</button>` : ''}
      ${i < picked.length - 1 ? `<button class="x" data-jmv="${i}" data-dir="1">↓</button>` : ''}
      <button class="x" data-junpick="${id}">✕</button></div>`).join('')}
    <div class="row" style="margin-top:8px"><button class="btn pri" id="joinGo" ${picked.length < 2 ? 'disabled' : ''}>Verbinden & bearbeiten (${picked.length})</button>
      <span class="err" id="joinErr"></span></div>`;
}
$('joinStart').onclick = () => { picking = !picking; picked = []; draw(); };
document.addEventListener('click', async e => {
  if (!picking) return;
  const b = e.target.closest('[data-jmv],[data-junpick],#joinGo');
  if (b) {
    if (b.dataset.junpick) picked = picked.filter(x => x !== b.dataset.junpick);
    else if (b.dataset.jmv) { const i = +b.dataset.jmv, j = i + +b.dataset.dir; [picked[i], picked[j]] = [picked[j], picked[i]]; }
    else {
      b.disabled = true;
      try { const { id } = await api('/api/join', { ids: picked }); location.href = '/edit/' + id; return; }
      catch (x) { $('joinErr').textContent = x.message; b.disabled = false; return; }
    }
    return draw();
  }
  const card = e.target.closest('.card');
  if (!card || card.classList.contains('off')) return;
  e.preventDefault();
  const id = card.dataset.id;
  if (picked.includes(id)) picked = picked.filter(x => x !== id);
  else {  // new clips go to their place in the stream timeline
    const at = c => clips.find(x => x.id === c)?.created_at || '';
    picked = [...picked, id].sort((a, b) => at(a) < at(b) ? -1 : at(a) > at(b) ? 1 : 0);
  }
  draw();
}, true);

function drawStatus() {  // update only the status pills while a title is being typed
  for (const c of clips) {
    const el = document.querySelector(`.card[data-id="${c.id}"] .st`);
    if (el) { const [cls, label] = state(c); el.className = 'pill st ' + cls; el.textContent = label; }
  }
}

async function saveTitle(inp) {
  const c = clips.find(x => x.id === inp.dataset.t);
  if (!c || inp.value === (c.overlay_title ?? c.title)) return;
  await fetch(`/api/clip/${c.id}/title`, { method: 'POST', body: JSON.stringify({ overlay_title: inp.value }) });
  c.overlay_title = inp.value;
  const s = inp.nextElementSibling; s.textContent = '✓'; setTimeout(() => s.textContent = '', 1500);
}
document.addEventListener('change', e => { if (e.target.matches('.tin input')) saveTitle(e.target); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.tin input')) e.target.blur(); });
// downloaded but not prepared yet: watch the source video already
document.addEventListener('click', e => {
  const t = e.target.closest('[data-play]');
  if (!t) return;
  $('vid').src = '/raw/' + t.dataset.play; $('dlg').showModal(); $('vid').play().catch(() => {});
});
$('dlg').addEventListener('click', e => { if (e.target === $('dlg')) $('dlg').close(); });
$('dlg').addEventListener('close', () => { $('vid').pause(); $('vid').removeAttribute('src'); });
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-ign],[data-back]');
  if (!b) return;
  const id = b.dataset.ign || b.dataset.back;
  await fetch(`/api/clip/${id}/status`, { method: 'POST', body: JSON.stringify({ status: b.dataset.ign ? 'ignored' : 'new' }) });
  load();
});

load();
setInterval(() => { if (!document.hidden) load(); }, 4000);
</script>
