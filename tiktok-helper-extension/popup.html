<!doctype html><html lang="de"><meta charset="utf-8">
<style>
:root{--bg:#fff;--fg:#161616;--mute:#777;--line:#eee;--card:#f6f6f6}
@media (prefers-color-scheme: dark){:root{--bg:#161616;--fg:#eee;--mute:#999;--line:#2a2a2a;--card:#1f1f1f}}
body{margin:0;width:380px;font:13px -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
h1{font-size:15px;margin:0}
#list{max-height:520px;overflow:auto;padding:8px}
.c{display:flex;gap:10px;padding:8px;border-radius:10px;background:var(--card);margin-bottom:8px;align-items:center}
.c img{width:96px;height:54px;object-fit:cover;border-radius:6px;background:#000;flex:none}
.i{flex:1;min-width:0}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m{color:var(--mute);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b{display:flex;flex-direction:column;gap:4px}
button{font:inherit;border:0;border-radius:6px;padding:6px 9px;cursor:pointer;font-weight:600}
.go{background:#fe2c55;color:#fff}.done{background:transparent;color:var(--mute);border:1px solid var(--line)}
.msg{padding:14px;color:var(--mute);text-align:center}.err{color:#f85149}
.pl{color:#25a8a4;font-weight:600}
.saved{display:inline-block;margin-top:5px;padding:3px 8px;border-radius:6px;background:#25a8a4;color:#fff;font-weight:700;font-size:12px}
.plan{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.planerr{flex-basis:100%;white-space:normal}.plan[hidden]{display:none}
.plan input{flex:1;min-width:0;font:inherit;padding:4px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
</style>
<header><h1>Clips zum Posten</h1><button class="done" id="reload">↻</button></header>
<div id="list"><div class="msg">Lade…</div></div>
<footer style="border-top:1px solid var(--line);padding:8px 14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">
  <span class="m">Seite analysieren:</span>
  <button class="done" data-stage="1-leer">1 · leere Upload-Seite</button>
  <button class="done" data-stage="2-video-gewaehlt">2 · nach Video-Auswahl</button>
  <button class="done" data-stage="3-nach-posten">3 · Dialog nach „Posten“</button>
  <button class="done" id="test">Verbindung testen</button>
</footer>
<pre id="log" style="margin:0 14px 12px;white-space:pre-wrap;font:11px ui-monospace,monospace;color:var(--mute)"></pre>
<script src="popup.js"></script>
